version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # Also bump transitive gems (rack, nokogiri, ...); advisories there fail the audit.
  allow:
  - dependency-type: all
  # One PR per week for all minor/patch bumps; majors stay separate PRs.
  groups:
    bundler-minor-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
