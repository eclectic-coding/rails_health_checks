name: Scheduled audit

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run bundler-audit
        run: bundle exec rake bundle:audit:update bundle:audit:check

      - name: Run Brakeman
        if: ${{ !cancelled() }}
        run: bundle exec rake brakeman

      - name: Open or update an issue on failure
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled security audit failing"
          body="The scheduled audit failed: ${RUN_URL}. Fix with \`bundle update --conservative <gem>\` for the gems listed in the log."
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing: ${RUN_URL}"
          else
            gh issue create --title "$title" --body "$body"
          fi
